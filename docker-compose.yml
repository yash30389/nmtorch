services:
  nmtorch:
    build:
      context: .
    container_name: nmtorch
    ports:
      - "127.0.0.1:${NMTORCH_PORT:-8765}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    init: true
    restart: unless-stopped
